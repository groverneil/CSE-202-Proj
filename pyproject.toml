[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nxncube"
version = "0.1.0"
description = "Generic n x n x n cube representation with geometry-generated moves"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest"]
viz = ["open3d==0.20.0"]

[tool.setuptools.packages.find]
include = ["nxncube*", "solvers*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:dash"
